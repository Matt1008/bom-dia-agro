# ============================================================
# ATUALIZAÇÃO AUTOMÁTICA — Bom Dia Agro
#
# O CEPEA publica UM valor por dia útil, e não avisa a hora certa.
# Por isso o robô fica de olho de hora em hora na janela em que a
# publicação costuma sair, em vez de checar uma vez só e correr o
# risco de pegar o número velho o dia inteiro.
#
# Todos os horários do GitHub são em UTC. Brasília = UTC - 3.
# ============================================================

name: Atualizar preços e notícias

on:
  schedule:
    # 09:00 UTC = 06:00 Brasília — rodada completa da manhã
    # (preços + notícias, para o app amanhecer pronto)
    - cron: '0 9 * * 1-5'

    # 17:00 às 22:00 UTC = 14:00 às 19:00 Brasília — de hora em hora.
    # É a janela em que o CEPEA solta o indicador do dia.
    - cron: '0 17,18,19,20,21 * * 1-5'

    # 22:00 UTC = 19:00 Brasília — rodada completa e fechamento do dia
    - cron: '0 22 * * 1-5'

  workflow_dispatch:        # botão para rodar na mão quando quiser

permissions:
  contents: write           # deixa o robô salvar os arquivos atualizados

# Se uma rodada ainda estiver em andamento, a próxima espera.
# Evita duas rodadas gravando o mesmo arquivo ao mesmo tempo.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Nas rodadas de hora em hora, busca só preço (notícia não muda
      # tão rápido e republicar o site oito vezes por dia é desperdício).
      - name: Decidir o tipo de rodada
        id: tipo
        run: |
          if [ "${{ github.event.schedule }}" = "0 17,18,19,20,21 * * 1-5" ]; then
            echo "apenas_precos=1" >> $GITHUB_OUTPUT
            echo "Rodada rápida: só preços."
          else
            echo "apenas_precos=0" >> $GITHUB_OUTPUT
            echo "Rodada completa: preços e notícias."
          fi

      - name: Buscar preços, moedas e notícias
        env:
          APENAS_PRECOS: ${{ steps.tipo.outputs.apenas_precos }}
          # Cópia durável do histórico. Cadastre em:
          #   Settings > Secrets and variables > Actions > New repository secret
          # Sem esses dois segredos o robô funciona igual, só não guarda no banco.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/atualizar-precos.mjs

      # Se o CEPEA estiver fora do ar, os arquivos ficam como estavam.
      # Nada é inventado para tapar buraco.
      - name: Conferir se os dados continuam válidos
        run: |
          node -e "
            const d = require('./dados/precos.json');
            const n = Object.values(d.produtos||{}).reduce((s,r)=>s+Object.keys(r).length,0);
            if (!n) { console.error('Nenhuma cotação no arquivo!'); process.exit(1); }
            console.log(n + ' cotações no ar, atualizadas em ' + d.atualizado_em);
          "

      - name: Salvar o que mudou
        run: |
          git config user.name  "Robo Bom Dia Agro"
          git config user.email "actions@github.com"
          git add dados/
          if git diff --staged --quiet; then
            echo "Nada mudou nesta rodada. Site não será republicado."
          else
            git commit -m "Preços de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
            echo "Dados atualizados e enviados."
          fi
